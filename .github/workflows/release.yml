name: Release

# Publishes a versioned release when a tag such as v1.0.4 is pushed. The app's
# update check and install.sh both read the latest release created here.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the version in CMakeLists.txt
        run: |
          version=$(sed -n 's/^project(PktSwerve VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | tr -d '\r')
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CMakeLists.txt version $version"
            exit 1
          fi

  macos:
    needs: check
    uses: ./.github/workflows/macos.yml

  windows:
    needs: check
    uses: ./.github/workflows/windows.yml

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets and checksums
        run: |
          mkdir release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "PktSwerve $GITHUB_REF_NAME" $flags
