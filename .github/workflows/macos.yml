name: macOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: write   # publishes the rolling macos-latest release

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.*'   # same Qt line as the Windows build
          cache: true

      - name: Configure (universal, Apple Silicon + Intel)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log

      # Job logs need a GitHub login, annotations don't: copy the compiler
      # errors into one so they can be read from the public API.
      - name: Publish compiler errors
        if: failure()
        run: |
          errors=$(grep -E "error:|Error [0-9]|undefined symbol|ld: " build.log | head -40 \
                   | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${errors:-no error lines found, see the Build step log}"

      - name: Bundle Qt into the app and ad-hoc sign it
        run: |
          macdeployqt build/PktSwerve.app
          codesign --force --deep --sign - build/PktSwerve.app

      - name: Create DMG
        run: |
          mkdir dmg
          cp -R build/PktSwerve.app dmg/
          cp packaging/macos/Install.command "dmg/Install PktSwerve.command"
          chmod +x "dmg/Install PktSwerve.command"
          cp packaging/macos/README.txt "dmg/READ ME FIRST.txt"
          ln -s /Applications dmg/Applications
          hdiutil create -volname PktSwerve -srcfolder dmg -ov -format UDZO PktSwerve-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: PktSwerve-macOS
          path: PktSwerve-macOS.dmg

      # install.sh downloads this asset with curl, which sidesteps Gatekeeper
      # without an Apple Developer account.
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete macos-latest --cleanup-tag --yes || true
          gh release create macos-latest PktSwerve-macOS.dmg             --target "$GITHUB_SHA" --prerelease             --title "PktSwerve macOS (latest build)"             --notes "Install with one command: see the README. Built from $GITHUB_SHA."
